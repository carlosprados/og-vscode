<!-- A globe: the activity bar renders this monochrome, so it is stroke-only and
     inherits currentColor. Meridians and parallels rather than a filled sphere,
     because at 24px a filled shape reads as a blob. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
  <circle cx="12" cy="12" r="9"/>
  <path d="M3 12h18"/>
  <ellipse cx="12" cy="12" rx="4" ry="9"/>
  <path d="M5.6 6.2c1.8 1.1 4 1.7 6.4 1.7s4.6-.6 6.4-1.7"/>
  <path d="M5.6 17.8c1.8-1.1 4-1.7 6.4-1.7s4.6.6 6.4 1.7"/>
</svg>
